name: Deploy Pipeline with Tests

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: discovery-server
            path: discovery-server
          - name: catalog-service
            path: services/catalog-service
          - name: inventory-service
            path: services/inventory-service
          - name: budgeting-service
            path: services/budgeting-service
          - name: auth-service
            path: services/auth-service
          - name: api-gateway
            path: gateway/api-gateway
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Executar testes
        working-directory: ${{ matrix.service.path }}
        run: mvn clean test -B

      - name: Publicar relatório de testes
        if: always() && hashFiles(format('{0}/target/surefire-reports/*.xml', matrix.service.path)) != ''
        uses: dorny/test-reporter@v1
        with:
          name: Resultados dos Testes - ${{ matrix.service.name }}
          path: ${{ matrix.service.path }}/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment: production
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build dos serviços
        run: |
          set -euo pipefail
          services=(
            discovery-server
            services/catalog-service
            services/inventory-service
            services/budgeting-service
            services/auth-service
            gateway/api-gateway
          )

          for service in "${services[@]}"; do
            echo "::group::Build $service"
            (cd "$service" && mvn clean package -DskipTests -B)
            echo "::endgroup::"
          done

      - name: Simular deploy
        run: |
          echo "::group::Informações de Deploy"
          echo "Tag/Versão: ${GITHUB_REF#refs/tags/}"
          echo "Commit SHA: $GITHUB_SHA"
          echo "Actor: $GITHUB_ACTOR"
          echo "Repositório: $GITHUB_REPOSITORY"
          echo "::endgroup::"

          echo "::notice::Iniciando deploy simulado..."

          mkdir -p deliverable
          find . -path '*/target/*.jar' -not -path './target/*' -not -name '*.original' -exec cp {} deliverable/ \;
          tar -czf crochetapp-deliverable.tgz deliverable

          if [ -s crochetapp-deliverable.tgz ]; then
            echo "::notice::Entregável crochetapp-deliverable.tgz gerado com sucesso!"
          else
            echo "::error::Falha ao gerar o entregável"
            exit 1
          fi

      - name: Publicar entregável
        uses: actions/upload-artifact@v4
        with:
          name: crochetapp-deliverable
          path: crochetapp-deliverable.tgz
          if-no-files-found: error