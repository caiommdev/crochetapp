version: '3.8'

# --------------------------------------------------------------------------
# Fase 1 — Um banco PostgreSQL por microsserviço (Database per Service).
# Cada serviço só enxerga o SEU banco. Não há banco compartilhado.
# --------------------------------------------------------------------------
services:

  # ---------------- Bancos de dados (um por serviço) ----------------
  catalog-db:
    image: postgres:16
    container_name: crochet_catalog_db
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=catalog_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    volumes:
      - catalog_data:/var/lib/postgresql/data

  inventory-db:
    image: postgres:16
    container_name: crochet_inventory_db
    restart: always
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=inventory_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    volumes:
      - inventory_data:/var/lib/postgresql/data

  budgeting-db:
    image: postgres:16
    container_name: crochet_budgeting_db
    restart: always
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=budgeting_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    volumes:
      - budgeting_data:/var/lib/postgresql/data

  # ---------------- Microsserviços ----------------
  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    container_name: crochet_catalog_service
    restart: on-failure
    depends_on:
      - catalog-db
      - inventory-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://catalog-db:5432/catalog_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
      - INVENTORY_URL=http://inventory-service:8082

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: crochet_inventory_service
    restart: on-failure
    depends_on:
      - inventory-db
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://inventory-db:5432/inventory_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin

  budgeting-service:
    build:
      context: .
      dockerfile: services/budgeting-service/Dockerfile
    container_name: crochet_budgeting_service
    restart: on-failure
    depends_on:
      - budgeting-db
      - catalog-service
      - inventory-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://budgeting-db:5432/budgeting_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
      - CATALOG_URL=http://catalog-service:8081
      - INVENTORY_URL=http://inventory-service:8082

  # ---------------- API Gateway (porta única de entrada) ----------------
  api-gateway:
    build:
      context: .
      dockerfile: gateway/api-gateway/Dockerfile
    container_name: crochet_api_gateway
    restart: on-failure
    depends_on:
      - catalog-service
      - inventory-service
      - budgeting-service
    ports:
      - "8080:8080"
    environment:
      - CATALOG_URL=http://catalog-service:8081
      - INVENTORY_URL=http://inventory-service:8082
      - BUDGETING_URL=http://budgeting-service:8083
      - CORS_ALLOWED_ORIGINS=http://localhost:3000

volumes:
  catalog_data:
  inventory_data:
  budgeting_data:
