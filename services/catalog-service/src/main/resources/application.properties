spring.application.name=catalog-service
server.port=8081

# Banco PRÓPRIO do Catalog (Database per Service)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/catalog_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# URL do Inventory Service (para agregar o estoque nas respostas de material)
inventory.url=${INVENTORY_URL:http://localhost:8082}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
# Registrar pelo IP (facilita em Docker)
eureka.instance.prefer-ip-address=true
