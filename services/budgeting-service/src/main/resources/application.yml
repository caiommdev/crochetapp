spring:
  application:
    name: budgeting-service
  # Banco PRÓPRIO do Budgeting (Database per Service)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/budgeting_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: budgeting-service
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8083

kafka:
  topic:
    reservation-requested: reservation-requested
    reservation-released: reservation-released
    material-defined: material-defined
    material-deleted: material-deleted
    recipe-defined: recipe-defined
    recipe-deleted: recipe-deleted
    product-defined: product-defined
    product-deleted: product-deleted
    stock-level-changed: stock-level-changed
    reservation-processed: reservation-processed

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # Registrar pelo IP (facilita em Docker)
    prefer-ip-address: true
