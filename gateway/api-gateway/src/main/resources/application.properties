spring.application.name=api-gateway
server.port=8080

# Registro no Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# ---- Rotas (lb:// = descobre via Eureka + balanceia) ----
# Catalog
spring.cloud.gateway.server.webflux.routes[0].id=catalog-materials
spring.cloud.gateway.server.webflux.routes[0].uri=lb://catalog-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/materials/**

spring.cloud.gateway.server.webflux.routes[1].id=catalog-recipes
spring.cloud.gateway.server.webflux.routes[1].uri=lb://catalog-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/recipes/**

spring.cloud.gateway.server.webflux.routes[2].id=catalog-products
spring.cloud.gateway.server.webflux.routes[2].uri=lb://catalog-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/products/**

# Inventory
spring.cloud.gateway.server.webflux.routes[3].id=inventory-stock
spring.cloud.gateway.server.webflux.routes[3].uri=lb://inventory-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/stock/**

# Budgeting
spring.cloud.gateway.server.webflux.routes[4].id=budgeting-budgets
spring.cloud.gateway.server.webflux.routes[4].uri=lb://budgeting-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/budgets/**

# ---- CORS ----
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:3000
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*