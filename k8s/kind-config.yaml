kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: crochetapp
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30000
        hostPort: 3000
        protocol: TCP
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30900
        hostPort: 9000
        protocol: TCP
      - containerPort: 30233
        hostPort: 8233
        protocol: TCP
