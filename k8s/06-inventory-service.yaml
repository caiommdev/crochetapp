apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: crochetapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              until nc -z inventory-db 5432 && nc -z rabbitmq 5672 && nc -z discovery-server 8761;
              do echo "aguardando inventory-db, rabbitmq e discovery-server"; sleep 2; done
      containers:
        - name: inventory-service
          image: inventory-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://inventory-db:5432/inventory_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: crochetapp-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crochetapp-secrets
                  key: POSTGRES_PASSWORD
            - name: EUREKA_URL
              value: http://discovery-server:8761/eureka/
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: crochetapp-secrets
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crochetapp-secrets
                  key: RABBITMQ_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: crochetapp
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8082
      targetPort: 8082