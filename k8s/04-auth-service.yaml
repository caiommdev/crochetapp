apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: crochetapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
        - name: wait-for-db-and-eureka
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              until nc -z auth-db 5432 && nc -z discovery-server 8761;
              do echo "aguardando auth-db e discovery-server"; sleep 2; done
      containers:
        - name: auth-service
          image: auth-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://auth-db:5432/auth_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: crochetapp-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crochetapp-secrets
                  key: POSTGRES_PASSWORD
            - name: EUREKA_URL
              value: http://discovery-server:8761/eureka/
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: crochetapp-secrets
                  key: JWT_SECRET
          readinessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: crochetapp
spec:
  selector:
    app: auth-service
  ports:
    - port: 8084
      targetPort: 8084