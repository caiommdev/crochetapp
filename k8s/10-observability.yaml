apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-postgres
  namespace: crochetapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-postgres
  template:
    metadata:
      labels:
        app: temporal-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: temporal
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PASSWORD
              value: temporal
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-postgres
  namespace: crochetapp
spec:
  selector:
    app: temporal-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: crochetapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
    spec:
      initContainers:
        - name: wait-for-temporal-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              until nc -z temporal-postgres 5432;
              do echo "aguardando temporal-postgres"; sleep 2; done
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.25.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7233
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: temporal-postgres
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PWD
              value: temporal
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: crochetapp
spec:
  selector:
    app: temporal
  ports:
    - port: 7233
      targetPort: 7233
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: crochetapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-ui
  template:
    metadata:
      labels:
        app: temporal-ui
    spec:
      initContainers:
        - name: wait-for-temporal
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              until nc -z temporal 7233;
              do echo "aguardando temporal"; sleep 2; done
      containers:
        - name: temporal-ui
          image: temporalio/ui:2.30.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: crochetapp
spec:
  type: NodePort
  selector:
    app: temporal-ui
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30233
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graylog-mongo
  namespace: crochetapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graylog-mongo
  template:
    metadata:
      labels:
        app: graylog-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:6.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: graylog-mongo
  namespace: crochetapp
spec:
  selector:
    app: graylog-mongo
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graylog-opensearch
  namespace: crochetapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graylog-opensearch
  template:
    metadata:
      labels:
        app: graylog-opensearch
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.11.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: plugins.security.disabled
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: -Xms512m -Xmx512m
---
apiVersion: v1
kind: Service
metadata:
  name: graylog-opensearch
  namespace: crochetapp
spec:
  selector:
    app: graylog-opensearch
  ports:
    - port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graylog
  namespace: crochetapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graylog
  template:
    metadata:
      labels:
        app: graylog
    spec:
      initContainers:
        - name: wait-for-graylog-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              until nc -z graylog-mongo 27017 && nc -z graylog-opensearch 9200;
              do echo "aguardando mongo/opensearch"; sleep 2; done
      containers:
        - name: graylog
          image: graylog/graylog:5.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
            - containerPort: 12201
              protocol: UDP
          env:
            - name: GRAYLOG_PASSWORD_SECRET
              value: troque-este-secret-por-uma-string-bem-grande
            - name: GRAYLOG_ROOT_PASSWORD_SHA2
              value: 8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918
            - name: GRAYLOG_HTTP_EXTERNAL_URI
              value: http://localhost:9000/
            - name: GRAYLOG_MONGODB_URI
              value: mongodb://graylog-mongo:27017/graylog
            - name: GRAYLOG_ELASTICSEARCH_HOSTS
              value: http://graylog-opensearch:9200
---
apiVersion: v1
kind: Service
metadata:
  name: graylog
  namespace: crochetapp
spec:
  type: NodePort
  selector:
    app: graylog
  ports:
    - name: web
      port: 9000
      targetPort: 9000
      nodePort: 30900
    - name: gelf-udp
      port: 12201
      targetPort: 12201
      protocol: UDP